# PostgreSQL for PALCO. Compose reads .env only for interpolation: the
# container receives these variables and never the Meta token.
#
# The name pins the project even if the folder is named differently, and the
# volume ends up as palco_pgdata. Without `name:` on the volume, another
# project (-p) gets its own and never shares this one.
name: palco

services:
  postgres:
    image: postgres:18.6-alpine3.24
    restart: unless-stopped
    environment:
      POSTGRES_USER: palco_admin
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Falta POSTGRES_PASSWORD en .env}
      POSTGRES_DB: palco
      PALCO_APP_PASSWORD: ${PALCO_APP_PASSWORD:?Falta PALCO_APP_PASSWORD en .env}
      PALCO_LECTOR_PASSWORD: ${PALCO_LECTOR_PASSWORD:?Falta PALCO_LECTOR_PASSWORD en .env}
    ports:
      # 55432 rather than 5432, to avoid clashing with another PostgreSQL on the
      # host. Bound to localhost only: the database is not exposed to the network.
      - '127.0.0.1:${POSTGRES_PORT:-55432}:5432'
    volumes:
      # Since PostgreSQL 18 the volume is /var/lib/postgresql, not .../data:
      # mounting the old path would keep nothing.
      - pgdata:/var/lib/postgresql
      - ./docker/postgres/init:/docker-entrypoint-initdb.d:ro
    healthcheck:
      # -h 127.0.0.1: initdb's temporary server only listens on the Unix socket,
      # so the container is not reported ready before the roles exist.
      test: ['CMD-SHELL', 'pg_isready -h 127.0.0.1 -U palco_admin -d palco']
      interval: 2s
      timeout: 3s
      retries: 30

volumes:
  pgdata:
